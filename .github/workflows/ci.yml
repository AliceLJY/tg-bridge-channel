name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check config schema
        run: bun run check-configs config.example.json

      - name: Run tests
        run: bun test

      - name: Check Claude local contract
        run: bun run check:claude-contract

      - name: Check package contents
        run: bun run package:check
